analysis:
  enable_analysis: true
  generate_excel_summary: true
  generate_interactive_plots: false
anonymization:
  attributes:
    insensitive_attributes:
    - Debtor
    - Tuition fees up to date
    - Application mode
    - Application order
    - Admission grade
    - Daytime/evening attendance
    - Previous qualification (grade)
    - Mother's qualification
    - Father's qualification
    - Mother's occupation
    - Father's occupation
    - Unemployment rate
    - Inflation rate
    - GDP
    - Displaced
    - Curricular units 1st sem (credited)
    - Curricular units 1st sem (enrolled)
    - Curricular units 1st sem (evaluations)
    - Curricular units 1st sem (approved)
    - Curricular units 1st sem (grade)
    - Curricular units 1st sem (without evaluations)
    - Curricular units 2nd sem (credited)
    - Curricular units 2nd sem (enrolled)
    - Curricular units 2nd sem (evaluations)
    - Curricular units 2nd sem (approved)
    - Curricular units 2nd sem (grade)
    - Curricular units 2nd sem (without evaluations)
    - Target
    quasi_identifiers:
    - Age at enrollment
    - Gender
    - Nacionality
    - Marital status
    - Course
    - Previous qualification
    - Educational special needs
    - International
    sensitive_attributes:
    - Scholarship_holder
  delete_after_evaluation: false
  enable_anonymization: true
  hierarchies:
    Age at enrollment: src/anonymization/anonymARXij/src/hierarchies_studentPerformance/age_enrollment.csv
    Course: src/anonymization/anonymARXij/src/hierarchies_studentPerformance/course.csv
    Educational special needs: src/anonymization/anonymARXij/src/hierarchies_studentPerformance/educational_special_needs.csv
    Gender: src/anonymization/anonymARXij/src/hierarchies_studentPerformance/gender.csv
    International: src/anonymization/anonymARXij/src/hierarchies_studentPerformance/international.csv
    Marital status: src/anonymization/anonymARXij/src/hierarchies_studentPerformance/marital_status.csv
    Nacionality: src/anonymization/anonymARXij/src/hierarchies_studentPerformance/nationality.csv
    Previous qualification: src/anonymization/anonymARXij/src/hierarchies_studentPerformance/previous_qualification.csv
  hierarchy_config: {}
  models:
    k_anonymity: 9
    l_diversity:
      attribute: Scholarship_holder
      value: 2
  suppression_limit: 0.5
dataset:
  path: datasets/original/studentPerformance.csv
  separator: ;
  target_column: Target
  test_size: 0.3
hybrid:
  delete_hybrid_after_evaluation: false
  enable_hybrid: true
  reuse_params: true
  save_intermediate_files: false
  synthesizer: TVAE
preprocessing:
  encoding_type: binary
  handle_missing_values: mode
synthesis:
  enable_synthetic_generation: false
  synthesizers:
    CTGAN:
      class_name: CTGANSynthesizer
      custom_generated_rows: 10000
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: same_as_original
      params:
        epochs: 300
      row_multiplier: 1
    CustomSynthesizer:
      class_name: CustomSynthesizer
      custom_generated_rows: 7000
      enabled: false
      import_path: custom.custom_synthesizer
      num_generated_rows: custom
      params:
        noise_factor: 0.2
      row_multiplier: 1
    GaussianCopula:
      class_name: GaussianCopulaSynthesizer
      custom_generated_rows: 5000
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: same_as_original
      params: {}
      row_multiplier: 1
    TVAE:
      class_name: TVAESynthesizer
      custom_generated_rows: 5000
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: same_as_original
      params:
        epochs: 300
      row_multiplier: 1
utility:
  enable_utility_evaluation: true
  metrics:
    AUC-ROC: true
    Accuracy: true
    CohenKappa: true
    F1: true
    LogLoss: true
    MCC: true
    Precision: true
    Recall: true
  models:
    DecisionTree: true
    KNN: true
    LogisticRegression: true
    RandomForest: true
    SVM: false
    XGBoost: false

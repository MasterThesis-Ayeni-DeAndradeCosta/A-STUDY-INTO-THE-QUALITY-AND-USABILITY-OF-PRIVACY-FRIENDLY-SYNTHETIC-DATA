dataset:
  path: "datasets/original/loan.csv" # Path to the dataset
  separator: "," # Delimiter used in the dataset (e.g., "," or "\t")
  target_column: "Loan_Status" # Name of the target column
  excluded_columns:
    - "Loan_ID"
  test_size: 0.2

preprocessing:
  handle_missing_values: "drop" # Options: "drop", "mean", "median", "mode"
  encoding_type: "binary" # Type of encoding, currently only "binary" is supported

synthesis:
  enable_synthetic_generation: false # Set to false to skip # IMPORTANT: Ensure that boolean values are lowercase (true/false), not capitalized (True/False).
  synthesizers:
    CTGAN:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "CTGANSynthesizer"
      params:
        epochs: 50
      num_generated_rows: "same_as_original" # Options: "same_as_original", "custom"
      custom_generated_rows: 10000 # Only used if num_generated_rows is "custom"
      row_multiplier: 8
    TVAE:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "TVAESynthesizer"
      params:
        epochs: 50
      num_generated_rows: "same_as_original" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 10000 # TVAE will generate 5000 rows
      row_multiplier: 8
    GaussianCopula:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "GaussianCopulaSynthesizer"
      params: {}
      num_generated_rows: "same_as_original" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 10000
      row_multiplier: 8
    CustomSynthesizer:
      enabled: false # Set to true if using a custom one
      import_path: "custom.custom_synthesizer"
      class_name: "CustomSynthesizer"
      params:
        noise_factor: 0.2
      num_generated_rows: "custom" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 7000
      row_multiplier: 8

anonymization:
  enable_anonymization: true # IMPORTANT: Ensure that boolean values are lowercase (true/false), not capitalized (True/False).
  delete_after_evaluation: false
  suppression_limit: 0.50
  attributes:
    quasi_identifiers:
      - "Gender"
      - "Married"
      - "Education"
      - "Dependents"
      - "Self_Employed"
      - "Property_Area"
      - "Credit_History"
      - "Loan_Amount_Term"

    sensitive_attributes:
      - "LoanAmount"

    insensitive_attributes: # target colum must be present in insensitve attributes so it doesnt get surpessed
      - "Loan_Status"
      - "ApplicantIncome"
      - "CoapplicantIncome"

  hierarchies:
    "Gender": "src/anonymization/anonymARXij/src/hierarchies_loan/gender.csv"
    "Married": "src/anonymization/anonymARXij/src/hierarchies_loan/married.csv"
    "Education": "src/anonymization/anonymARXij/src/hierarchies_loan/education.csv"
    "Dependents": "src/anonymization/anonymARXij/src/hierarchies_loan/dependents.csv"
    "Self_Employed": "src/anonymization/anonymARXij/src/hierarchies_loan/self_employed.csv"
    "Property_Area": "src/anonymization/anonymARXij/src/hierarchies_loan/property_area.csv"
    "Credit_History": "src/anonymization/anonymARXij/src/hierarchies_loan/credit_history.csv"

  hierarchy_config: {}
  models:
    k_anonymity: 50
    l_diversity:
      attribute: "LoanAmount"
      value: 5
      model: entropy

hybrid:
  enable_hybrid: false
  delete_hybrid_after_evaluation: false
  reuse_params: true
  save_intermediate_files: false

utility:
  enable_utility_evaluation: true # IMPORTANT: Ensure that boolean values are lowercase (true/false), not capitalized (True/False).
  models:
    LogisticRegression: true
    KNN: true
    RandomForest: true
    DecisionTree: true
    SVM: true
    XGBoost: false

  metrics:
    Accuracy: true
    Precision: true
    Recall: true
    F1: true
    AUC-ROC: true
    LogLoss: true # Disabled for models that don't support probabilities
    CohenKappa: true
    MCC: true

analysis:
  enable_analysis: true # Set to false to skip all analysis
  generate_interactive_plots: false # Use Plotly for HTML plots
  generate_excel_summary: true # Save Excel file with summary stats

dataset:
  path: "datasets/original/studentPerformance.csv" # Path to the dataset
  separator: ";" # Delimiter used in the dataset (e.g., "," or "\t")
  target_column: "Target" # Name of the target column
  test_size: 0.2

preprocessing:
  handle_missing_values: "mode" # Options: "drop", "mean", "median", "mode"
  encoding_type: "binary" # Type of encoding, currently only "binary" is supported

synthesis:
  enable_synthetic_generation: false # Set to false to skip #IMPORTANT: Ensure that boolean values are lowercase (true/false), not capitalized (True/False).
  synthesizers:
    CTGAN:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "CTGANSynthesizer"
      params:
        epochs: 50
      num_generated_rows: "same_as_original" # Options: "same_as_original", "custom"
      custom_generated_rows: 10000 # Only used if num_generated_rows is "custom"
      row_multiplier: 8
    TVAE:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "TVAESynthesizer"
      params:
        epochs: 50
      num_generated_rows: "same_as_original" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 5000 # TVAE will generate 5000 rows
      row_multiplier: 8
    GaussianCopula:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "GaussianCopulaSynthesizer"
      params: {}
      num_generated_rows: "same_as_original" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 5000
      row_multiplier: 8
    CustomSynthesizer:
      enabled: false # Set to true if using a custom one
      import_path: "custom.custom_synthesizer"
      class_name: "CustomSynthesizer"
      params:
        noise_factor: 0.2
      num_generated_rows: "custom" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 7000
      row_multiplier: 8

anonymization:
  enable_anonymization: true # IMPORTANT: Ensure that boolean values are lowercase (true/false), not capitalized (True/False).
  delete_after_evaluation: false
  suppression_limit: 0.0
  attributes:
    quasi_identifiers:
      - "Age at enrollment"
      - "Gender"
      - "Nacionality"
      - "Marital status"
      - "Course"
      - "Previous qualification"
      - "Educational special needs"
      - "International"

    sensitive_attributes:
      - "Scholarship_holder"

    insensitive_attributes:
      - "Debtor"
      - "Tuition fees up to date"
      - "Application mode"
      - "Application order"
      - "Admission grade"
      - "Daytime/evening attendance"
      - "Previous qualification (grade)"
      - "Mother's qualification"
      - "Father's qualification"
      - "Mother's occupation"
      - "Father's occupation"
      - "Unemployment rate"
      - "Inflation rate"
      - "GDP"
      - "Displaced"
      - "Curricular units 1st sem (credited)"
      - "Curricular units 1st sem (enrolled)"
      - "Curricular units 1st sem (evaluations)"
      - "Curricular units 1st sem (approved)"
      - "Curricular units 1st sem (grade)"
      - "Curricular units 1st sem (without evaluations)"
      - "Curricular units 2nd sem (credited)"
      - "Curricular units 2nd sem (enrolled)"
      - "Curricular units 2nd sem (evaluations)"
      - "Curricular units 2nd sem (approved)"
      - "Curricular units 2nd sem (grade)"
      - "Curricular units 2nd sem (without evaluations)"
      - "Target"

  hierarchies:
    "Age at enrollment": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/age_enrollment.csv"
    "Gender": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/gender.csv"
    "Nacionality": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/nationality.csv"
    "Marital status": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/marital_status.csv"
    "Course": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/course.csv"
    "Previous qualification": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/previous_qualification.csv"
    "Mother's occupation": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/occupation2.csv"
    "Father's occupation": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/father_occupation2.csv"
    "Educational special needs": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/educational_special_needs.csv"
    #"Admission grade": "src/anonymization/anonymARXij/src/hierarchies_studentPerformance/admission_grade.csv"

  hierarchy_config: {}
  models:
    k_anonymity: 2
    l_diversity:
      attribute: "Scholarship_holder"
      value: 2

hybrid:
  enable_hybrid: false
  delete_hybrid_after_evaluation: false
  reuse_params: true
  save_intermediate_files: false

utility:
  enable_utility_evaluation: true # IMPORTANT: Ensure that boolean values are lowercase (true/false), not capitalized (True/False).
  models:
    LogisticRegression: true
    KNN: true
    RandomForest: true
    DecisionTree: true
    SVM: false
    XGBoost: false

  metrics:
    Accuracy: true
    Precision: true
    Recall: true
    F1: true
    AUC-ROC: true
    LogLoss: true # Disabled for models that don't support probabilities
    CohenKappa: true
    MCC: true

analysis:
  enable_analysis: true # Set to false to skip all analysis
  generate_interactive_plots: false # Use Plotly for HTML plots
  generate_excel_summary: true # Save Excel file with summary stats

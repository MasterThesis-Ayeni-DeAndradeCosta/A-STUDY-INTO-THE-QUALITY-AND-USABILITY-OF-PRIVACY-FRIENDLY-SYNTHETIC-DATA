dataset:
  path: "datasets/original/crimeData.csv" # Path to the dataset
  separator: "," # Delimiter used in the dataset (e.g., "," or "\t")
  target_column: "Status" # Name of the target column
  test_size: 0.2

preprocessing:
  handle_missing_values: "drop" # Options: "drop", "mean", "median", "mode"
  encoding_type: "binary" # Type of encoding, currently only "binary" is supported

synthesis:
  enable_synthetic_generation: true # Set to false to skip # IMPORTANT: Ensure that boolean values are lowercase (true/false), not capitalized (True/False).
  synthesizers:
    CTGAN:
      enabled: false
      import_path: "sdv.single_table"
      class_name: "CTGANSynthesizer"
      params:
        epochs: 50
      num_generated_rows: "same_as_original" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 10000 # Only used if num_generated_rows is "custom"
      row_multiplier: 8
    TVAE:
      enabled: false
      import_path: "sdv.single_table"
      class_name: "TVAESynthesizer"
      params:
        epochs: 50
      num_generated_rows: "same_as_original" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 5000 # TVAE will generate 5000 rows
      row_multiplier: 8
    GaussianCopula:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "GaussianCopulaSynthesizer"
      params: {}
      num_generated_rows: "same_as_original"
      custom_generated_rows: 5000
    CustomSynthesizer:
      enabled: false # Set to true if using a custom one
      import_path: "custom.custom_synthesizer"
      class_name: "CustomSynthesizer"
      params:
        noise_factor: 0.2
      num_generated_rows: "custom" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 7000
      row_multiplier: 8

anonymization:
  enable_anonymization: true # IMPORTANT: Ensure that boolean values are lowercase (true/false), not capitalized (True/False).
  delete_after_evaluation: true
  suppression_limit: 0.1
  attributes:
    quasi_identifiers:
      - "Victim_age"
      - "Victim_sex"
      - "Victim_descent"
      - "LAT"
      - "LON"

    sensitive_attributes:
      - "Crime_Code"
    insensitive_attributes:
      - "DR_NO"
      - "Time_occured"
      - "Premis"
      - "Weapon"
      - "Status"

  hierarchies:
    "Victim_age": "src/anonymization/anonymARXij/src/hierarchies/hierarchy_age_4.csv"
    "Victim_sex": "src/anonymization/anonymARXij/src/hierarchies/hierarchy_sex.csv"
    "Victim_descent": "src/anonymization/anonymARXij/src/hierarchies/hierarchy_descent.csv"

  hierarchy_config:
    LAT: 10
    LON: 10

  models:
    k_anonymity: 5
    l_diversity:
      attribute: "Crime_Code"
      value: 2

hybrid:
  enable_hybrid: true
  reuse_params: true
  synthesizer: "GaussianCopulaSynthesizer"
  # Only required when reuse_params is false
  k_anonymity: 5
  l_diversity: 3
  epochs: 30
  num_generated_rows: 5000
  save_intermediate_files: false

utility:
  enable_utility_evaluation: true # IMPORTANT: Ensure that boolean values are lowercase (true/false), not capitalized (True/False).
  models:
    LogisticRegression: true
    KNN: true
    RandomForest: true
    DecisionTree: true
    SVM: true
    XGBoost: false

  metrics:
    Accuracy: true
    Precision: true
    Recall: true
    F1: true
    AUC-ROC: true
    LogLoss: true # Disabled for models that don't support probabilities
    CohenKappa: true
    MCC: true

analysis:
  enable_analysis: true # Set to false to skip all analysis
  generate_interactive_plots: false # Use Plotly for HTML plots
  generate_excel_summary: true # Save Excel file with summary stats

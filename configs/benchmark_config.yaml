dataset:
  path: "datasets/original/loan.csv" # Path to the dataset
  separator: "," # Delimiter used in the dataset (e.g., "," or "\t")
  target_column: "Loan_Status" # Name of the target column
  test_size: 0.2

preprocessing:
  handle_missing_values: "mean" # Options: "drop", "mean", "median", "mode"
  encoding_type: "binary" # Type of encoding, currently only "binary" is supported

synthesis:
  enable_synthetic_generation: true # Set to false to skip
  synthesizers:
    CTGAN:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "CTGANSynthesizer"
      params:
        epochs: 50
      num_generated_rows: "custom" # Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 10000 # Only used if num_generated_rows is "custom"
      row_multiplier: 8
    TVAE:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "TVAESynthesizer"
      params:
        epochs: 50
      num_generated_rows: "multiple" #Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 5000 # TVAE will generate 5000 rows
      row_multiplier: 4 # TVAE will generate 2x rows as original
    GaussianCopula:
      enabled: true
      import_path: "sdv.single_table"
      class_name: "GaussianCopulaSynthesizer"
      params: {}
      num_generated_rows: "multiple"
    CustomSynthesizer:
      enabled: false # Set to true if using a custom one
      import_path: "custom.custom_synthesizer"
      class_name: "CustomSynthesizer"
      params:
        noise_factor: 0.2
      num_generated_rows: "multiple" #Options: "same_as_original", "custom", "multiple"
      custom_generated_rows: 7000
      row_multiplier: 2

anonymization:
  enable_anonymization: false
  suppression_limit: 0.1
  attributes:
    quasi_identifiers:
      - "Gender"
      - "Married"
      - "Education"

    sensitive_attributes:
      - "ApplicantIncome"

    insensitive_attributes:
      - "Loan_Amount_Term"
      - "Dependents"
      - "Loan_Status"

  hierarchies:
    "Gender": "src/anonymization/anonymARXij/src/hierarchies_loan/gender.csv"
    "Married": "src/anonymization/anonymARXij/src/hierarchies_loan/married.csv"
    "Education": "src/anonymization/anonymARXij/src/hierarchies_loan/education.csv"

  hierarchy_config: {}
  models:
    k_anonymity: 5
    l_diversity:
      attribute: "ApplicantIncome"
      value: 2

hybrid:
  enable_hybrid: true
  execution_order: "anonymization_first" # or "synthetic_first"
  reuse_params: false
  synthesizer: "CTGAN"

  # Only required when reuse_configs is false
  k_anonymity: 5
  l_diversity: 3
  epochs: 30
  num_generated_rows: 5000

  save_intermediate_files: false

utility:
  enable_utility_evaluation: false
  models:
    LogisticRegression: true
    KNN: true
    RandomForest: true
    DecisionTree: false
    SVM: false
    XGBoost: false

  metrics:
    Accuracy: true
    Precision: true
    Recall: true
    F1: true
    AUC-ROC: true
    LogLoss: true # Disabled for models that don't support probabilities
    CohenKappa: true
    MCC: true

analysis:
  enable_analysis: false # Set to false to skip all analysis
  generate_interactive_plots: false # Use Plotly for HTML plots
  generate_excel_summary: true # Save Excel file with summary stats

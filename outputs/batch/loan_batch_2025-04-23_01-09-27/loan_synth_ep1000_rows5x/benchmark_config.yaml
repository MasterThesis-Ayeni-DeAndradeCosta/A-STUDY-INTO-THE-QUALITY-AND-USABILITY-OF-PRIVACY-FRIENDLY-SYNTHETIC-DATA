analysis:
  enable_analysis: true
  generate_excel_summary: true
  generate_interactive_plots: false
anonymization:
  attributes:
    insensitive_attributes:
    - Loan_Amount_Term
    - Dependents
    - Loan_Status
    quasi_identifiers:
    - Gender
    - Married
    - Education
    sensitive_attributes:
    - ApplicantIncome
  delete_after_evaluation: true
  enable_anonymization: false
  hierarchies:
    Education: src/anonymization/anonymARXij/src/hierarchies_loan/education.csv
    Gender: src/anonymization/anonymARXij/src/hierarchies_loan/gender.csv
    Married: src/anonymization/anonymARXij/src/hierarchies_loan/married.csv
  hierarchy_config: {}
  models:
    k_anonymity: 5
    l_diversity:
      attribute: ApplicantIncome
      value: 2
  suppression_limit: 0.1
dataset:
  path: datasets/original/loan.csv
  separator: ','
  target_column: Loan_Status
  test_size: 0.3
hybrid:
  delete_hybrid_after_evaluation: false
  enable_hybrid: false
  reuse_params: true
  save_intermediate_files: false
output_dir: outputs/batch/loan_batch_2025-04-23_01-09-27/loan_synth_ep1000_rows5x
preprocessing:
  encoding_type: binary
  handle_missing_values: drop
synthesis:
  enable_synthetic_generation: true
  synthesizers:
    CTGAN:
      class_name: CTGANSynthesizer
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: multiple
      params:
        epochs: 1000
      row_multiplier: 5
    CustomSynthesizer:
      class_name: CustomSynthesizer
      custom_generated_rows: 7000
      enabled: false
      import_path: custom.custom_synthesizer
      num_generated_rows: custom
      params:
        noise_factor: 0.2
      row_multiplier: 8
    GaussianCopula:
      class_name: GaussianCopulaSynthesizer
      custom_generated_rows: 10000
      enabled: false
      import_path: sdv.single_table
      num_generated_rows: same_as_original
      row_multiplier: 8
    TVAE:
      class_name: TVAESynthesizer
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: multiple
      params:
        epochs: 1000
      row_multiplier: 5
utility:
  enable_utility_evaluation: true
  metrics:
    AUC-ROC: true
    Accuracy: true
    CohenKappa: true
    F1: true
    LogLoss: true
    MCC: true
    Precision: true
    Recall: true
  models:
    DecisionTree: true
    KNN: true
    LogisticRegression: true
    RandomForest: true
    SVM: true
    XGBoost: false

analysis:
  enable_analysis: true
  generate_excel_summary: true
  generate_interactive_plots: false
anonymization:
  attributes:
    insensitive_attributes:
    - default
    - balance
    - contact
    - day
    - month
    - campaign
    - pdays
    - previous
    - poutcome
    - y
    quasi_identifiers:
    - age
    - marital
    - education
    - job
    - housing
    sensitive_attributes:
    - loan
  delete_after_evaluation: false
  enable_anonymization: false
  hierarchies:
    age: src/anonymization/anonymARXij/src/hierarchies_bankMarketing/age.csv
    education: src/anonymization/anonymARXij/src/hierarchies_bankMarketing/education.csv
    housing: src/anonymization/anonymARXij/src/hierarchies_bankMarketing/housing.csv
    job: src/anonymization/anonymARXij/src/hierarchies_bankMarketing/job.csv
    marital: src/anonymization/anonymARXij/src/hierarchies_bankMarketing/marital.csv
  hierarchy_config: {}
  models:
    k_anonymity: 2
    l_diversity:
      attribute: loan
      value: 1
  suppression_limit: 0.01
dataset:
  excluded_columns:
  - duration
  path: datasets/original/bankMarketing.csv
  separator: ;
  target_column: y
  test_size: 0.2
hybrid:
  delete_hybrid_after_evaluation: false
  enable_hybrid: false
  reuse_params: true
  save_intermediate_files: false
output_dir: outputs/batch/bankMarketing_batch_2025-05-08_13-17-59/bankMarketing_synth_ep200_rows1x
preprocessing:
  encoding_type: binary
  handle_missing_values: drop
synthesis:
  enable_synthetic_generation: true
  synthesizers:
    CTGAN:
      class_name: CTGANSynthesizer
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: multiple
      params:
        epochs: 200
      row_multiplier: 1
    CustomSynthesizer:
      class_name: CustomSynthesizer
      custom_generated_rows: 7000
      enabled: false
      import_path: custom.custom_synthesizer
      num_generated_rows: custom
      params:
        noise_factor: 0.2
      row_multiplier: 1
    GaussianCopula:
      class_name: GaussianCopulaSynthesizer
      custom_generated_rows: 5000
      enabled: false
      import_path: sdv.single_table
      num_generated_rows: same_as_original
      params: {}
    TVAE:
      class_name: TVAESynthesizer
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: multiple
      params:
        epochs: 200
      row_multiplier: 1
utility:
  enable_utility_evaluation: true
  metrics:
    AUC-ROC: true
    Accuracy: true
    CohenKappa: true
    F1: true
    LogLoss: true
    MCC: true
    Precision: true
    Recall: true
  models:
    DecisionTree: true
    KNN: true
    LogisticRegression: true
    RandomForest: true
    SVM: false
    XGBoost: false

analysis:
  enable_analysis: true
  generate_excel_summary: true
  generate_interactive_plots: false
anonymization:
  anonymized_output: datasets/anonymized/bankMarketing_anonymized.csv
  attributes:
    insensitive_attributes:
    - contact
    - pdays
    - previous
    - y
    quasi_identifiers:
    - age
    - marital
    - education
    sensitive_attributes:
    - balance
  enable_anonymization: false
  hierarchies:
    age: src/anonymization/anonymARXij/src/hierarchies_bankMarketing/age.csv
    education: src/anonymization/anonymARXij/src/hierarchies_bankMarketing/education.csv
    marital: src/anonymization/anonymARXij/src/hierarchies_bankMarketing/marital.csv
  hierarchy_config: {}
  models:
    k_anonymity: 3
    l_diversity:
      attribute: balance
      value: 2
  suppression_limit: 0.05
dataset:
  path: datasets/original/loan.csv
  separator: ','
  target_column: Loan_Status
  test_size: 0.5
output_dir: outputs\batch\loan_batch_2025-03-23_14-23-24\custom_generated_rows2000
preprocessing:
  encoding_type: binary
  handle_missing_values: drop
synthesis:
  enable_synthetic_generation: true
  synthesizers:
    CTGAN:
      class_name: CTGANSynthesizer
      custom_generated_rows: 2000
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: custom
      params:
        epochs: 50
    CustomSynthesizer:
      class_name: CustomSynthesizer
      custom_generated_rows: 7000
      enabled: false
      import_path: custom.custom_synthesizer
      num_generated_rows: custom
      params:
        noise_factor: 0.2
    GaussianCopula:
      class_name: GaussianCopulaSynthesizer
      custom_generated_rows: 2000
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: custom
      params: {}
    TVAE:
      class_name: TVAESynthesizer
      custom_generated_rows: 2000
      enabled: true
      import_path: sdv.single_table
      num_generated_rows: custom
      params:
        epochs: 50
utility:
  enable_utility_evaluation: true
  metrics:
    AUC-ROC: true
    Accuracy: true
    CohenKappa: true
    F1: true
    LogLoss: true
    MCC: true
    Precision: true
    Recall: true
  models:
    DecisionTree: true
    KNN: true
    LogisticRegression: true
    RandomForest: true
    SVM: false
    XGBoost: false
